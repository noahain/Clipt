name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # dry run: builds everything, publishes nothing

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.13'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install NSIS
        run: choco install nsis -y
        shell: pwsh

      - name: Build, sign, and release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Release ${{ github.ref_name }}'
          releaseBody: |
            Download the Windows installer:
            - `x64-setup.exe` (recommended) or `x64_en-US.msi`

            See CHANGELOG.md in the repository for details.

            Ignore the `.sig` files - the auto-updater uses those.
          releaseDraft: false
          prerelease: false

      # Manual dry-run path: build without publishing a release,
      # then upload the bundles as workflow artifacts for inspection.
      - name: Build only (dry-run)
        if: github.event_name == 'workflow_dispatch'
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          path: |
            src-tauri/target/release/bundle/**
            src-tauri/target/*/release/bundle/**
          if-no-files-found: warn

  # tauri-action's own latest.json is not guaranteed to cover both Windows
  # installer formats with the exact keys the updater looks up. This job runs
  # after the build, reads every uploaded updater .sig (whose verbatim text IS
  # the signature value), and writes one combined latest.json.
  finalize-updater:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Assemble latest.json
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          WORK="$(mktemp -d)"
          assets=$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')

          # first non-.sig asset matching the regex
          find_asset() { echo "$assets" | grep -E "$1" | grep -v '\.sig$' | head -n1; }
          # download <name>.sig and print its verbatim contents (the signature)
          sig_of() {
            gh release download "$TAG" --repo "$REPO" -p "$1.sig" -O "$WORK/$1.sig" --clobber >/dev/null
            cat "$WORK/$1.sig"
          }

          WIN_MSI=$(find_asset '_x64_en-US\.msi$')
          WIN_NSIS=$(find_asset '_x64-setup\.exe$')
          for v in WIN_MSI WIN_NSIS; do
            if [ -z "${!v}" ]; then echo "::error::missing updater asset for $v"; exit 1; fi
          done

          jq -n \
            --arg version "$VERSION" \
            --arg pubdate "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            --arg win_msi_url   "$BASE/$WIN_MSI"  --arg win_msi_sig  "$(sig_of "$WIN_MSI")" \
            --arg win_nsis_url  "$BASE/$WIN_NSIS" --arg win_nsis_sig "$(sig_of "$WIN_NSIS")" \
            '{
              version: $version,
              notes: "See the release assets to download and install.",
              pub_date: $pubdate,
              platforms: {
                "windows-x86_64":      { signature: $win_msi_sig,  url: $win_msi_url },
                "windows-x86_64-msi":  { signature: $win_msi_sig,  url: $win_msi_url },
                "windows-x86_64-nsis": { signature: $win_nsis_sig, url: $win_nsis_url }
              }
            }' > "$WORK/latest.json"

          echo "Assembled latest.json:"
          jq '.platforms | keys' "$WORK/latest.json"
          gh release upload "$TAG" --repo "$REPO" "$WORK/latest.json" --clobber
